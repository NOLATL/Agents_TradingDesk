# Data contract: Alpaca Market Data (Basic tier) — momentum-scan price engine
# (DECISIONS.md 2026-07-30 "Three-vendor architecture", Phase A). DATA ONLY:
# Alpaca here is a market-data vendor, never order routing — broker/execution
# integration remains anti-scope (the simulator is internal; a broker is a
# pre-live gate, and it is not this).
source_name: alpaca_scan
description: >
  Multi-symbol daily OHLCV bars (US equities/ETFs, consolidated SIP feed) for
  the operator-only momentum scan: ~503 S&P 500 members + pocket ETFs.
endpoints:
  - https://data.alpaca.markets/v2/stocks/bars
auth: >
  API key pair (free Basic signup, no funded account): APCA-API-KEY-ID /
  APCA-API-SECRET-KEY request headers from ALPACA_API_KEY_ID /
  ALPACA_API_SECRET_KEY in .env. Headers are never persisted (fetch_and_cache
  stores query params only); keys never enter documents or LLM context.

data_semantics:
  raw_or_adjusted: >
    Explicit per request via the `adjustment` param. The scan fetches
    adjustment=all (split+dividend adjusted, comparable to Tiingo adjClose)
    NIGHTLY and adjustment=raw WEEKLY (Saturday run) as a corporate-action
    cross-check. No inline splitFactor/divCash fields — corporate actions are
    never inferred locally; Tiingo remains the corporate-action authority and
    the referee (data/reconcile.py) arbitrates adjusted-close divergence.
  currency: USD
  timezone: America/New_York
  session_date_rule: >
    A bar timestamped T covers XNYS session date(T). Scan-only reference
    data — first_eligible_decision_time = ingestion_time (never a decision
    input, mirroring wikipedia_sp500). The most recent 15 minutes of SIP
    data are embargoed on Basic; irrelevant at 00:30 ET for the prior close.
  adjustment_restatement: >
    The adjusted series restates on every dividend/split. The nightly window
    (alpaca.history_days, default 130 calendar days — covers the 63-session
    momentum horizon + 50-session average) is refetched in FULL each night,
    so restatements are absorbed nightly; each fetch is a new immutable
    document (invariant 4), diffs detectable by hash.
  null_rule: >
    A symbol absent from a batch response is an absence (rendered in scan
    coverage counts), never filled. Malformed bars are skipped derive-on-read.

revision_policy: >
  Full-window refetch nightly; every page cached immutably with a
  scan_session stored-param tag, so "the newest fetch" is the set of pages
  sharing the max scan_session — never a mutable table.

source_priority: 2               # scan engine; Tiingo (priority 1) stays authoritative
fallback_sources: [tiingo]       # Alpaca dark → scan degrades to Tiingo ETF pockets
expected_publication_delay: >
  Consolidated daily bars final shortly after close; the 00:30 ET scan is
  hours clear of the 15-minute Basic embargo.

rate_limit: >
  Basic: 200 requests/min. Nightly budget: ~542 symbols / alpaca.chunk_size
  (100) chunks x 1-2 pages (limit=10000 bars/request) for adjustment=all
  ~ 6-12 requests; Saturday adds the raw pass (~doubles). Hard cap
  alpaca.max_requests_per_run (40). On 429: skip-and-note (scan degradation
  pattern), never retried that night.

license_permitted_use: >
  Official API under Alpaca's market-data terms: personal use, local
  immutable caching for own analysis, no redistribution of raw data.
