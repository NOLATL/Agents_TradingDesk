    enabled: true                           # vault MD stays the artifact of record
    out_dir: ""                             # default reporting/output/deepdive-html (tailscale-served)
    url_base: "https://framework.taila4cc29.ts.net/desk-reports"
    # ntfy push (tap-to-open) fires from deepdive.write when a URL renders
