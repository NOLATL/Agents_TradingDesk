# Config baseline for experiment EXP-001 (frozen by docs/EXPERIMENT_REGISTRY.md).
# Config over hardcoding: services read these values; none are scattered literals.
# Changing any value under `frozen:` after Stage 0 means a NEW experiment id.

experiment_id: EXP-001

frozen:
  universe: sp500_current_forward_only
  paper_capital_usd: 10000
  positions:
    min_concurrent: 6
    max_concurrent: 10
  risk_limits:
    max_single_name_pct: 10
    max_theme_pct: 25
    max_sector_pct: 30
    max_deployable_pct: 100
    sizing_method: cluster_risk_budgeting   # inverse-vol within cluster; Ledoit-Wolf for cluster id
  costs:
    commission_usd: 0
    slippage_model: tiered_adverse          # buy@open+adverse, sell@open−adverse; calibrated vs observed opens
  rebalance: weekly_plus_event_driven
  benchmarks: [spy, equal_weight_sp500_proxy, momentum_top10, same_basket_no_llm_timing]
  models:
    reasoning: qwen3:30b-a3b               # digest pinned in EXPERIMENT_REGISTRY.md
  calendars: exchange_calendars             # never assume Mon–Fri

# Values below may be tuned before Stage 3 starts; once the forward run begins they freeze too.
tunable:
  quarantine_resolution_window_days: 5      # freeze-and-mark → human window before bounded auto-liquidation
  monthly_thesis_cull: true

# Stage 1 vertical slice (grid-constraint theme; human-confirmed universe).
stage1_slice:
  theme: grid-constraint
  strategy_tag: grid-constraint
  symbols: [ETN, GEV, HUBB, PWR, NVT]       # chosen by GICS sub-industry + disclosure, never price
  fred_series: [IPUTIL, CAPUTLG2211S, INDPRO]
  edgar_forms: ["10-K", "10-Q", "8-K"]
  edgar_filings_per_company: 6              # most recent N filings of the above forms
  emphasis_terms:                           # deterministic term list for management-emphasis counts
    - data center
    - datacenter
    - grid
    - transformer
    - switchgear
    - electrification
    - interconnection
    - backlog
    - utility capex
    - artificial intelligence
  llm:
    base_url: http://localhost:11434/v1
    model_tag: qwen3:30b-a3b
    scout_model_tag: qwen3.6:35b    # research-layer override for the nightly
    #   scout ONLY (human ruling 2026-07-29, DECISIONS.md — swapped same day
    #   at Jared's direction) — engine roles keep model_tag. Digest at swap:
    #   07d35212591f (also in DECISIONS.md).
    num_ctx: 40960
    max_retries: 3
  vault_dir: /home/jared/obsidian-brain/TradingDesk

# Stage 2 deterministic engine (values feed EngineConfig; all Decimals as strings).
engine:
  initial_cash: "10000"
  slippage:
    default_bps: "10"                       # conservative starter tier
    tiers:                                  # first matching vol threshold (descending) wins
      - {vol_threshold: "0.60", bps: "35"}
      - {vol_threshold: "0.40", bps: "20"}
  quarantine_window_sessions: 5             # trading sessions, not calendar days (DECISIONS.md)
  caps:
    max_single_name_pct: "10"
    max_theme_pct: "25"
    max_sector_pct: "30"
  breakers:
    drawdown_pct: "15"                      # market-risk: drawdown from HWM, EOD-only
  controls:
    spy_symbol: SPY
    ewp_symbol: RSP                         # equal-weight S&P proxy ETF (DECISIONS.md)
    # GENESIS DOCUMENTATION ONLY (superseded 2026-07-22, universe unfreeze):
    # the themes/theme_symbols tables are authoritative — accepted themes
    # widen the universe point-in-time (data/universe.py). These 15 names
    # record what was frozen at genesis 2026-07-20 and back the YAML-only
    # fallback used by tests and a pre-migration fresh DB.
    momentum_universe: [ETN, GEV, HUBB, PWR, NVT,
                        CEG, VST, ETR, PEG, DUK,
                        DHI, LEN, PHM, INVH, AMH]
    momentum_top_n: 10                      # Decision Register #7
    basket: [ETN, GEV, HUBB, PWR, NVT]      # same-basket control (superseded: DB point-in-time)
    benchmark_rebalance_sessions: 21        # ~monthly
  cluster_risk:
    correlation_threshold: 0.6              # Ledoit-Wolf-shrunk corr above this = same cluster
    risk_share_per_theme: "0.25"            # fixed share of portfolio risk per theme/cluster

# Stage 3 forward paper workflow (live run).
stage3:
  genesis_date: "2026-07-20"               # go-live Monday; live sim + controls start here
  live_experiment: EXP-001
  # GENESIS DOCUMENTATION ONLY (superseded 2026-07-22): themes now live in
  # the themes table (migration 004 backfilled these three) and are managed
  # via `ops.approve theme ...` — one accepted theme per day, all sources.
  themes:
    grid-constraint:                        # accepted at genesis
      symbols: [ETN, GEV, HUBB, PWR, NVT]
      active: true
    nuclear-renaissance:                    # CANDIDATE in the intake queue
      symbols: [CEG, VST, ETR, PEG, DUK]
      active: false
    housing-rental-pivot:                   # CANDIDATE in the intake queue
      symbols: [DHI, LEN, PHM, INVH, AMH]
      active: false
  alerts:
    provider: ntfy                          # topic in .env (NTFY_TOPIC), never in git
    # Self-hosted on the tailnet (ops/compose.ntfy.yaml + tailscale serve 8444).
    # iOS instant push relays a content-free poll signal via ntfy.sh
    # (NTFY_UPSTREAM_BASE_URL); message content never leaves this box.
    base_url: https://framework.taila4cc29.ts.net:8444
  schedule:
    daily_monitor: "23:00 America/New_York (post-close; Tiingo composite final)"
    weekly_research: "Fri 23:45 America/New_York (per accepted theme; spec 2026-07-22)"
    backup: "02:30 local (after the monitor)"
    momentum_scan: "Tue-Sat 00:30 America/New_York (own rate-limit hour; after the monitor)"

# Operator-only momentum scan (DECISIONS.md 2026-07-29 "Momentum scan").
# QUARANTINED (invariant 5): output is a human hypothesis vector only — never
# LLM analyst/scout context, theme_symbols, basket construction, or the
# engine. NOT under frozen: and NOT under engine: — experiment identity
# (frozen block + EngineConfig hash) is untouched by anything here.
scan:
  enabled: true
  horizons_sessions: [5, 21, 63]            # ~week / month / quarter
  max_fetches_per_run: 45                   # Tiingo free tier: 50 symbols/hour
  constituents_max_age_days: 7              # weekly Wikipedia snapshot
  constituents_stale_alert_days: 21
  narrator_model: null                      # null → stage1_slice.llm.model_tag
  # Three-vendor architecture Phase A (DECISIONS.md 2026-07-30):
  price_source: tiingo                      # ETF pocket series source; → alpaca after shadow week
  include_sp500_members: true               # single-name internals (needs alpaca.enabled)
  internals:
    avg_window_sessions: 50                 # %-above-moving-average window
    extreme_window_sessions: 63             # new-high/low window (Phase B upgrades to
                                            #   true 52wk via Schwab quote fields)
    dispersion_horizon_index: 1             # dispersion measured on 21d returns
  referee:
    enabled: true
    rel_tolerance_pct: "0.5"                # calibrate during shadow week
    window_sessions: 21
    min_overlap: 10

# Alpaca Basic (data-only, never order routing — contracts/alpaca.yaml).
# Scan price engine for single-name internals; quarantined like everything
# scan-side. NOT under frozen:/engine:.
alpaca:
  enabled: false                            # flip when ALPACA_API_KEY_ID/SECRET land in .env
  feed: sip
  chunk_size: 100
  history_days: 130                         # covers 63-session momentum + 50-session avg
  max_requests_per_run: 40
  raw_pass_session_weekday: 4               # Friday SESSION (Saturday 00:30 run) adds adjustment=raw
  # Pocket universe: each ETF IS a sector/industry/theme pocket. kind is
  # sector | industry | theme-etf ("theme-etf" avoids colliding with desk
  # theme vocabulary). gics_sub_industries (optional) drives the report's
  # "inside the pocket" context lines from sp500_constituents.
  pockets:
    - {ticker: XLB,  name: Materials,              kind: sector}
    - {ticker: XLC,  name: Communication Services, kind: sector}
    - {ticker: XLE,  name: Energy,                 kind: sector}
    - {ticker: XLF,  name: Financials,             kind: sector}
    - {ticker: XLI,  name: Industrials,            kind: sector}
    - {ticker: XLK,  name: Technology,             kind: sector,
       gics_sector: Information Technology}        # GICS name differs from display name
    - {ticker: XLP,  name: Consumer Staples,       kind: sector}
    - {ticker: XLRE, name: Real Estate,            kind: sector}
    - {ticker: XLU,  name: Utilities,              kind: sector}
    - {ticker: XLV,  name: Health Care,            kind: sector}
    - {ticker: XLY,  name: Consumer Discretionary, kind: sector}
    - {ticker: SMH,  name: Semiconductors,         kind: industry,
       gics_sub_industries: [Semiconductors, "Semiconductor Materials & Equipment"]}
    - {ticker: IGV,  name: Software,               kind: industry,
       gics_sub_industries: [Systems Software, Application Software]}
    - {ticker: FDN,  name: Internet,               kind: industry}
    - {ticker: CIBR, name: Cybersecurity,          kind: industry}
    - {ticker: XHB,  name: Homebuilders,           kind: industry,
       gics_sub_industries: [Homebuilding, Building Products]}
    - {ticker: ITA,  name: Aerospace & Defense,    kind: industry,
       gics_sub_industries: ["Aerospace & Defense"]}
    - {ticker: JETS, name: Airlines,               kind: industry,
       gics_sub_industries: [Passenger Airlines]}
    - {ticker: IYT,  name: Transports,             kind: industry,
       gics_sub_industries: [Rail Transportation, "Air Freight & Logistics",
                             Cargo Ground Transportation]}
    - {ticker: BOAT, name: Global Shipping,        kind: theme-etf}
    - {ticker: XRT,  name: Retail,                 kind: industry,
       gics_sub_industries: [Broadline Retail, Apparel Retail, Automotive Retail]}
    - {ticker: XBI,  name: Biotech,                kind: industry,
       gics_sub_industries: [Biotechnology]}
    - {ticker: PPH,  name: Pharma,                 kind: industry,
       gics_sub_industries: [Pharmaceuticals]}
    - {ticker: OIH,  name: Oil Services,           kind: industry,
       gics_sub_industries: ["Oil & Gas Equipment & Services"]}
    - {ticker: XOP,  name: Oil & Gas E&P,          kind: industry,
       gics_sub_industries: ["Oil & Gas Exploration & Production"]}
    - {ticker: URA,  name: Uranium,                kind: theme-etf}
    - {ticker: NLR,  name: Nuclear Energy,         kind: theme-etf}
    - {ticker: GRID, name: Smart Grid,             kind: theme-etf,
       gics_sub_industries: ["Electrical Components & Equipment"]}
    - {ticker: PAVE, name: US Infrastructure,      kind: theme-etf}
    - {ticker: TAN,  name: Solar,                  kind: theme-etf}
    - {ticker: KBE,  name: Banks,                  kind: industry,
       gics_sub_industries: [Diversified Banks]}
    - {ticker: KRE,  name: Regional Banks,         kind: industry,
       gics_sub_industries: [Regional Banks]}
    - {ticker: XME,  name: Metals & Mining,        kind: industry,
       gics_sub_industries: [Steel, Copper, "Diversified Metals & Mining", Gold]}
    - {ticker: GDX,  name: Gold Miners,            kind: theme-etf}
    - {ticker: COPX, name: Copper Miners,          kind: theme-etf}
    - {ticker: SLX,  name: Steel,                  kind: industry,
       gics_sub_industries: [Steel]}
    - {ticker: MOO,  name: Agribusiness,           kind: theme-etf,
       gics_sub_industries: ["Fertilizers & Agricultural Chemicals",
                             "Agricultural & Farm Machinery"]}
    - {ticker: LIT,  name: Lithium & Battery,      kind: theme-etf}
    - {ticker: BOTZ, name: Robotics & AI,          kind: theme-etf}
