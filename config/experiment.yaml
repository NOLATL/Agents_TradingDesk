# Config baseline for experiment EXP-001 (frozen by docs/EXPERIMENT_REGISTRY.md).
# Config over hardcoding: services read these values; none are scattered literals.
# Changing any value under `frozen:` after Stage 0 means a NEW experiment id.

experiment_id: EXP-001

frozen:
  universe: sp500_current_forward_only
  paper_capital_usd: 10000
  positions:
    min_concurrent: 6
    max_concurrent: 10
  risk_limits:
    max_single_name_pct: 10
    max_theme_pct: 25
    max_sector_pct: 30
    max_deployable_pct: 100
    sizing_method: cluster_risk_budgeting   # inverse-vol within cluster; Ledoit-Wolf for cluster id
  costs:
    commission_usd: 0
    slippage_model: tiered_adverse          # buy@open+adverse, sell@open−adverse; calibrated vs observed opens
  rebalance: weekly_plus_event_driven
  benchmarks: [spy, equal_weight_sp500_proxy, momentum_top10, same_basket_no_llm_timing]
  models:
    reasoning: qwen3:30b-a3b               # digest pinned in EXPERIMENT_REGISTRY.md
  calendars: exchange_calendars             # never assume Mon–Fri

# Values below may be tuned before Stage 3 starts; once the forward run begins they freeze too.
tunable:
  quarantine_resolution_window_days: 5      # freeze-and-mark → human window before bounded auto-liquidation
  monthly_thesis_cull: true

# Stage 1 vertical slice (grid-constraint theme; human-confirmed universe).
stage1_slice:
  theme: grid-constraint
  strategy_tag: grid-constraint
  symbols: [ETN, GEV, HUBB, PWR, NVT]       # chosen by GICS sub-industry + disclosure, never price
  fred_series: [IPUTIL, CAPUTLG2211S, INDPRO]
  edgar_forms: ["10-K", "10-Q", "8-K"]
  edgar_filings_per_company: 6              # most recent N filings of the above forms
  emphasis_terms:                           # deterministic term list for management-emphasis counts
    - data center
    - datacenter
    - grid
    - transformer
    - switchgear
    - electrification
    - interconnection
    - backlog
    - utility capex
    - artificial intelligence
  llm:
    base_url: http://localhost:11434/v1
    model_tag: qwen3:30b-a3b
    num_ctx: 40960
    max_retries: 3
  vault_dir: /home/jared/obsidian-brain/TradingDesk

# Stage 2 deterministic engine (values feed EngineConfig; all Decimals as strings).
engine:
  initial_cash: "10000"
  slippage:
    default_bps: "10"                       # conservative starter tier
    tiers:                                  # first matching vol threshold (descending) wins
      - {vol_threshold: "0.60", bps: "35"}
      - {vol_threshold: "0.40", bps: "20"}
  quarantine_window_sessions: 5             # trading sessions, not calendar days (DECISIONS.md)
  caps:
    max_single_name_pct: "10"
    max_theme_pct: "25"
    max_sector_pct: "30"
  breakers:
    drawdown_pct: "15"                      # market-risk: drawdown from HWM, EOD-only
  controls:
    spy_symbol: SPY
    ewp_symbol: RSP                         # equal-weight S&P proxy ETF (DECISIONS.md)
    # FROZEN AT GENESIS 2026-07-20 (human-confirmed): 15 names / 3 themes.
    # Widening after genesis = new experiment id (benchmark comparability).
    momentum_universe: [ETN, GEV, HUBB, PWR, NVT,
                        CEG, VST, ETR, PEG, DUK,
                        DHI, LEN, PHM, INVH, AMH]
    momentum_top_n: 10                      # Decision Register #7
    basket: [ETN, GEV, HUBB, PWR, NVT]      # same-basket-no-llm-timing control (active theme)
    benchmark_rebalance_sessions: 21        # ~monthly
  cluster_risk:
    correlation_threshold: 0.6              # Ledoit-Wolf-shrunk corr above this = same cluster
    risk_share_per_theme: "0.25"            # fixed share of portfolio risk per theme/cluster

# Stage 3 forward paper workflow (live run).
stage3:
  genesis_date: "2026-07-20"               # go-live Monday; live sim + controls start here
  live_experiment: EXP-001
  themes:
    grid-constraint:                        # active at genesis
      symbols: [ETN, GEV, HUBB, PWR, NVT]
      active: true
    nuclear-renaissance:                    # enters rotation once the cycle is stable
      symbols: [CEG, VST, ETR, PEG, DUK]
      active: false
    housing-rental-pivot:
      symbols: [DHI, LEN, PHM, INVH, AMH]
      active: false
  alerts:
    provider: ntfy                          # topic in .env (NTFY_TOPIC), never in git
    # Self-hosted on the tailnet (ops/compose.ntfy.yaml + tailscale serve 8444).
    # iOS instant push relays a content-free poll signal via ntfy.sh
    # (NTFY_UPSTREAM_BASE_URL); message content never leaves this box.
    base_url: https://framework.taila4cc29.ts.net:8444
  schedule:
    daily_monitor: "23:00 America/New_York (post-close; Tiingo composite final)"
    weekly_research: "Sat 09:00 America/New_York"
    backup: "02:30 local (after the monitor)"
